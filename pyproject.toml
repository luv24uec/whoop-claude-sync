[project]
name = "whoop-claude-sync"
version = "0.1.0"
description = "Pull Whoop data and dump Claude-friendly knowledge files for a Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whoop-claude-sync = "whoop_claude_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_claude_sync"]

[tool.hatch.build.targets.wheel.sources]
"src/whoop_claude_sync" = "whoop_claude_sync"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
